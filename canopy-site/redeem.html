<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club Key Lookup | The Canopy Club</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .wrap{ max-width: 560px; margin: 0 auto; padding: 50px 20px 80px; }
  .top-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 26px; }
  .top-row img{ height: 30px; }
  .logout-link{ font-size:.82rem; font-weight:700; color: var(--forest); text-decoration:underline; cursor:pointer; }
  h1{ font-size: 1.6rem; color: var(--forest); margin-bottom: 20px; }
  .search-row{ display:flex; gap:10px; margin-bottom: 30px; }
  .search-row input{ flex:1; padding:12px; border:1.5px solid var(--blush-deep); border-radius:8px; font-family:var(--font-body); font-size:1rem; }
  .search-row button{ border:none; cursor:pointer; }
  .result-card{ background: var(--cream-2); border-radius:14px; padding: 26px; }
  .status-badge{ display:inline-block; padding:5px 14px; border-radius:20px; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-bottom:14px; }
  .status-active{ background:var(--blush); color:var(--forest-deep); }
  .status-inactive{ background:#F0D5D0; color:#8A3420; }
  .member-name{ font-family:var(--font-display); font-size:1.5rem; color:var(--forest); margin-bottom:4px; }
  .redeem-row{ margin-top:20px; padding-top:18px; border-top:1px solid var(--blush); }
  .redeem-status{ font-size:.95rem; margin-bottom:12px; }
  .empty{ text-align:center; opacity:.7; padding:40px 0; }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-row">
    <img src="assets/logo-mark-transparent.png" alt="The Canopy Club">
    <span class="logout-link" id="logoutBtn">Sign Out</span>
  </div>

  <h1>Club Key Lookup</h1>

  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Name or phone number">
    <button class="btn btn-forest" onclick="doSearch()">Search</button>
  </div>

  <div id="result"><div class="empty">Scan a member's QR code, or search by name/phone above.</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://geshcdgajxmhrbcvltsy.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_GgXYNtWQ8Cs_jMwbDVejWw_-EtYm32v";
  const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Require staff login to use this tool
  supa.auth.getSession().then(({ data }) => {
    if (!data.session) window.location.href = "login.html";
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supa.auth.signOut();
    window.location.href = "login.html";
  });

  function todayStr(){
    return new Date().toISOString().split('T')[0];
  }

  function renderMember(m){
    const isActive = m.status === 'active';
    const alreadyRedeemed = m.last_coffee_redeemed === todayStr();
    document.getElementById('result').innerHTML = `
      <div class="result-card">
        <span class="status-badge ${isActive ? 'status-active' : 'status-inactive'}">${isActive ? 'Active Member' : 'Not Active'}</span>
        <div class="member-name">${m.name}</div>
        <div style="opacity:.75; font-size:.9rem;">${m.email || ''} ${m.phone ? '&middot; ' + m.phone : ''}</div>
        ${isActive ? `
          <div class="redeem-row">
            <p class="redeem-status">${alreadyRedeemed ? "Today's free coffee already redeemed." : "Today's free coffee: not yet redeemed."}</p>
            <button class="btn btn-forest" style="border:none; cursor:pointer;" ${alreadyRedeemed ? 'disabled' : ''} onclick="redeemCoffee('${m.id}')">
              ${alreadyRedeemed ? 'Redeemed' : 'Mark Coffee Redeemed'}
            </button>
          </div>
        ` : `<p style="margin-top:16px; opacity:.75;">This membership is not currently active — do not apply Club Key perks.</p>`}
      </div>
    `;
  }

  async function redeemCoffee(id){
    await supa.from('members').update({ last_coffee_redeemed: todayStr() }).eq('id', id);
    doSearch(); // refresh view
  }

  let lastQuery = "";
  async function doSearch(){
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;
    lastQuery = q;
    const { data, error } = await supa
      .from('members')
      .select('*')
      .or(`name.ilike.%${q}%,phone.ilike.%${q}%`)
      .limit(1);

    if (error || !data || data.length === 0){
      document.getElementById('result').innerHTML = `<div class="empty">No member found matching "${q}".</div>`;
      return;
    }
    renderMember(data[0]);
  }

  // If arriving from a scanned QR code (?id=...), look that member up directly
  const params = new URLSearchParams(window.location.search);
  const scannedId = params.get('id');
  if (scannedId){
    supa.from('members').select('*').eq('id', scannedId).single().then(({ data, error }) => {
      if (data) renderMember(data);
      else document.getElementById('result').innerHTML = `<div class="empty">QR code didn't match a member record.</div>`;
    });
  }

  document.getElementById('searchInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') doSearch();
  });
</script>

</body>
</html>
