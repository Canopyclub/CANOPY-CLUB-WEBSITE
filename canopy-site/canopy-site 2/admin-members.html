<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Members | The Canopy Club</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .wrap{ max-width: 780px; margin: 0 auto; padding: 50px 20px 90px; }
  .top-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 26px; }
  .top-row img{ height: 30px; }
  .logout-link{ font-size:.82rem; font-weight:700; color: var(--forest); text-decoration:underline; cursor:pointer; }
  h1{ font-size: 1.6rem; color: var(--forest); margin-bottom: 8px; }
  .add-card{ background: var(--cream-2); border-radius: 14px; padding: 26px; margin: 24px 0 40px; }
  .field-row{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .field-row input{ padding:11px; border:1.5px solid var(--blush-deep); border-radius:8px; font-family:var(--font-body); font-size:.95rem; }
  .add-card button{ border:none; cursor:pointer; }
  .toast{ background: var(--forest); color: var(--cream); padding: 12px 16px; border-radius: 8px; font-size:.88rem; margin-top: 14px; display:none; }
  .toast a{ color: var(--blush); text-decoration: underline; }
  table{ width:100%; border-collapse: collapse; font-size: .92rem; }
  th{ text-align:left; padding: 8px 10px; border-bottom: 2px solid var(--blush); font-size:.78rem; text-transform:uppercase; letter-spacing:.05em; color: var(--forest); }
  td{ padding: 10px; border-bottom: 1px solid var(--cream-2); vertical-align: middle; }
  .status-pill{ display:inline-block; padding:3px 10px; border-radius:14px; font-size:.7rem; font-weight:700; text-transform:uppercase; }
  .pill-active{ background:var(--blush); color:var(--forest-deep); }
  .pill-inactive{ background:#F0D5D0; color:#8A3420; }
  .small-btn{ font-size:.78rem; padding: 5px 10px; border-radius:6px; border:1px solid var(--forest); background:none; color:var(--forest); cursor:pointer; margin-right:6px; }
  .denied{ text-align:center; padding: 80px 20px; opacity:.75; }
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <div class="top-row">
    <img src="assets/logo-mark-transparent.png" alt="The Canopy Club">
    <span class="logout-link" id="logoutBtn">Sign Out</span>
  </div>
  <div id="content"><div class="denied">Loading&hellip;</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://geshcdgajxmhrbcvltsy.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_GgXYNtWQ8Cs_jMwbDVejWw_-EtYm32v";
  const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const content = document.getElementById('content');

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supa.auth.signOut();
    window.location.href = "login.html";
  });

  async function init(){
    const { data: sessionData } = await supa.auth.getSession();
    if (!sessionData.session){ window.location.href = "login.html"; return; }

    const { data: profile } = await supa.from('profiles').select('role, name').eq('id', sessionData.session.user.id).single();
    const allowed = profile && (profile.role === 'Shift Lead' || profile.role === 'Chef');

    if (!allowed){
      content.innerHTML = `<div class="denied">This page is for managers only. Ask a Shift Lead or the Chef to make changes here.</div>`;
      return;
    }

    renderPage();
  }

  function renderPage(){
    content.innerHTML = `
      <h1>Manage Club Key Members</h1>
      <p style="opacity:.75; font-size:.92rem;">Add a new member after they've paid via Stripe, and manage everyone's status here.</p>

      <div class="add-card">
        <div class="field-row">
          <input type="text" id="newName" placeholder="Full name">
          <input type="email" id="newEmail" placeholder="Email">
        </div>
        <div class="field-row">
          <input type="tel" id="newPhone" placeholder="Phone">
        </div>
        <button class="btn btn-forest" onclick="addMember()">Add Member</button>
        <div class="toast" id="addToast"></div>
      </div>

      <table>
        <thead>
          <tr><th>Name</th><th>Contact</th><th>Status</th><th>Card Link</th></tr>
        </thead>
        <tbody id="memberRows"><tr><td colspan="4">Loading members&hellip;</td></tr></tbody>
      </table>
    `;
    loadMembers();
  }

  async function addMember(){
    const name = document.getElementById('newName').value.trim();
    const email = document.getElementById('newEmail').value.trim();
    const phone = document.getElementById('newPhone').value.trim();
    if (!name){ alert('Name is required.'); return; }

    const { data, error } = await supa.from('members').insert({ name, email, phone, status: 'active' }).select().single();
    const toast = document.getElementById('addToast');

    if (error){
      toast.style.background = '#B4472A';
      toast.textContent = "Something went wrong adding this member. Try again.";
      toast.style.display = 'block';
      return;
    }

    const cardLink = `${window.location.origin}/card.html?id=${data.id}`;
    toast.style.background = 'var(--forest)';
    toast.innerHTML = `Added! Send them their card: <a href="${cardLink}" target="_blank">${cardLink}</a>`;
    toast.style.display = 'block';

    document.getElementById('newName').value = '';
    document.getElementById('newEmail').value = '';
    document.getElementById('newPhone').value = '';
    loadMembers();
  }

  async function loadMembers(){
    const { data, error } = await supa.from('members').select('*').order('name');
    const rows = document.getElementById('memberRows');
    if (error || !data || data.length === 0){
      rows.innerHTML = `<tr><td colspan="4">No members yet.</td></tr>`;
      return;
    }
    rows.innerHTML = data.map(m => {
      const cardLink = `${window.location.origin}/card.html?id=${m.id}`;
      const isActive = m.status === 'active';
      return `
        <tr>
          <td>${m.name}</td>
          <td style="font-size:.85rem; opacity:.8;">${m.email || ''}${m.phone ? '<br>' + m.phone : ''}</td>
          <td><span class="status-pill ${isActive ? 'pill-active' : 'pill-inactive'}">${isActive ? 'Active' : 'Inactive'}</span></td>
          <td>
            <button class="small-btn" onclick="copyLink('${cardLink}')">Copy Link</button>
            <button class="small-btn" onclick="toggleStatus('${m.id}', '${m.status}')">${isActive ? 'Deactivate' : 'Reactivate'}</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  function copyLink(link){
    navigator.clipboard.writeText(link);
    alert('Card link copied to clipboard.');
  }

  async function toggleStatus(id, currentStatus){
    const newStatus = currentStatus === 'active' ? 'inactive' : 'active';
    await supa.from('members').update({ status: newStatus }).eq('id', id);
    loadMembers();
  }

  init();
</script>

</body>
</html>
