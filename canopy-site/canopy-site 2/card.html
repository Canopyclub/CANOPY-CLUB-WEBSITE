<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Club Key | The Canopy Club</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .card-wrap{ min-height: 85vh; display:flex; align-items:center; justify-content:center; padding: 40px 20px; }
  .key-card{ background: var(--forest); color: var(--cream); border-radius: 20px; padding: 40px 32px; max-width: 380px; width:100%; text-align:center; }
  .key-card img.logo{ height: 40px; margin-bottom: 18px; filter: brightness(0) invert(1); }
  .key-card h1{ font-size: 1.4rem; color: var(--cream); margin-bottom: 4px; }
  .key-card .member-name{ font-family:var(--font-display); font-size: 1.7rem; color: var(--blush); margin-bottom: 22px; }
  .qr-box{ background: var(--cream); border-radius: 14px; padding: 18px; display:inline-block; margin-bottom: 20px; }
  .qr-box img{ display:block; width: 200px; height: 200px; }
  .key-card p.note{ font-size: .85rem; opacity: .85; }
  .empty{ text-align:center; padding: 60px 20px; opacity:.7; }
</style>
</head>
<body>

<div class="card-wrap" id="cardWrap">
  <div class="empty">Loading your Club Key&hellip;</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://geshcdgajxmhrbcvltsy.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_GgXYNtWQ8Cs_jMwbDVejWw_-EtYm32v";
  const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const params = new URLSearchParams(window.location.search);
  const memberId = params.get('id');
  const wrap = document.getElementById('cardWrap');

  if (!memberId){
    wrap.innerHTML = `<div class="empty">No member ID provided. Ask The Canopy Club for your card link.</div>`;
  } else {
    supa.from('members').select('*').eq('id', memberId).single().then(({ data, error }) => {
      if (error || !data){
        wrap.innerHTML = `<div class="empty">We couldn't find that membership. Please contact The Canopy Club.</div>`;
        return;
      }
      const redeemUrl = `${window.location.origin}/redeem.html?id=${data.id}`;
      const qrImg = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(redeemUrl)}`;
      wrap.innerHTML = `
        <div class="key-card">
          <img src="assets/logo-mark-transparent.png" alt="" class="logo">
          <h1>Club Key Member</h1>
          <div class="member-name">${data.name}</div>
          <div class="qr-box"><img src="${qrImg}" alt="Your Club Key QR code"></div>
          <p class="note">Show this at checkout for your daily coffee, catering discount, and birthday treat.</p>
        </div>
      `;
    });
  }
</script>

</body>
</html>
