<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Login | The Canopy Club</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .login-wrap{ min-height: 80vh; display:flex; align-items:center; justify-content:center; padding: 40px 20px; }
  .login-card{ background: var(--cream-2); border-radius: 16px; padding: 40px 34px; max-width: 380px; width:100%; }
  .login-card h1{ font-size: 1.6rem; color: var(--forest); text-align:center; margin-bottom: 6px; }
  .login-card p.sub{ text-align:center; font-size:.9rem; opacity:.75; margin-bottom: 26px; }
  .login-field{ margin-bottom: 16px; }
  .login-field label{ display:block; font-weight:700; font-size:.82rem; margin-bottom:6px; }
  .login-field input{ width:100%; padding:11px; border:1.5px solid var(--blush-deep); border-radius:8px; font-family:var(--font-body); font-size:1rem; }
  .login-error{ background:#FBE4DE; color:#8A3420; padding:10px 14px; border-radius:8px; font-size:.85rem; margin-bottom:16px; display:none; }
  .login-btn{ width:100%; border:none; cursor:pointer; }
  .logo-row{ display:flex; justify-content:center; margin-bottom: 22px; }
  .logo-row img{ height: 44px; }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="logo-row"><img src="assets/logo-mark-transparent.png" alt="The Canopy Club"></div>
    <h1>Team Login</h1>
    <p class="sub">Sign in to see today's prep notes.</p>

    <div class="login-error" id="loginError"></div>

    <form id="loginForm">
      <div class="login-field">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="login-field">
        <label>Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-forest login-btn">Sign In</button>
    </form>
    <p style="text-align:center; font-size:.8rem; opacity:.7; margin-top:18px;">Don't have a login yet? Ask your manager to set one up.</p>
  </div>
</div>

<!-- Supabase client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  // ---- Fill these in once your Supabase project is created ----
  const SUPABASE_URL = "YOUR_SUPABASE_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
  const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // If already logged in, skip straight to the portal
  supa.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = "portal.html";
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errBox = document.getElementById('loginError');
    errBox.style.display = 'none';

    const { error } = await supa.auth.signInWithPassword({ email, password });
    if (error) {
      errBox.textContent = "That email or password didn't match. Try again or ask your manager to reset it.";
      errBox.style.display = 'block';
      return;
    }
    window.location.href = "portal.html";
  });
</script>

</body>
</html>
