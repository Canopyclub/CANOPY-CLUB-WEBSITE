<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Grab & Go Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Playfair+Display:wght@700&family=Poppins:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  /* Layout: portrait 65" board matched to Caela's print menus; everything sized off board width (cqw) */
  :root {
    --cream: #faf7f2;
    --green: #176433;
    --pink: #edb2b4;
    --blush: #f5e5e3;
    --ink: #3d3d3a;
    --rule: #edb2b4;
    --script: "Lobster", "Brush Script MT", cursive;
    --serif: "Playfair Display", Georgia, serif;
    --sans: "Poppins", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--cream); color: var(--ink); font-family: var(--sans); overflow: hidden; cursor: none; }
  .board { position: relative; width: 100%; height: 100%; container-type: size; overflow: hidden; background: var(--cream); display: flex; flex-direction: column; }
  body.rot-right .board, body.rot-left .board { position: absolute; width: 100vh; height: 100vw; transform-origin: top left; }
  body.rot-right .board { top: 0; left: 100vw; transform: rotate(90deg); }
  body.rot-left .board { top: 100vh; left: 0; transform: rotate(-90deg); }

  .frame { position: absolute; inset: 6.5cqw 2.8cqw 2.8cqw; border: .2cqw solid var(--green); pointer-events: none; }
  .label { position: absolute; top: 1.4cqw; right: 2.8cqw; text-align: right; z-index: 2; }
  .label b { display: block; font-family: var(--serif); font-size: 6cqw; color: var(--pink); letter-spacing: .02em; line-height: 1; background: var(--cream); padding-left: 1.5cqw; }
  .label span { display: block; font-size: 1.9cqw; color: var(--green); margin-top: 1.2cqw; }

  .masthead { position: relative; z-index: 1; text-align: center; padding-top: 2cqw; flex: none; }
  .logo { width: 17cqw; display: block; margin: 0 auto; }
  .wordmark { font-family: var(--script); color: var(--green); font-size: 9.6cqw; line-height: 1.05; margin-top: .4cqw; }

  .menu { position: relative; flex: 1; display: grid; grid-template-columns: 1fr 1fr; column-gap: 5cqw; row-gap: 3.2cqw; padding: 3.6cqw 7cqw 0; align-content: start; }
  .full { grid-column: 1 / -1; }
  .full .items, .wide .items { display: grid; grid-template-columns: 1fr 1fr; column-gap: 5cqw; }
  section h2 { font-family: var(--script); font-weight: 400; color: var(--green); font-size: 5.4cqw; line-height: 1.15; padding-bottom: .4cqw; border-bottom: .2cqw solid var(--rule); }
  .note { font-size: 2cqw; color: var(--green); margin-top: .8cqw; }
  .items { margin-top: 1cqw; }
  .item { display: grid; grid-template-columns: 1fr auto; align-items: baseline; column-gap: 2cqw; padding: 1cqw 0; }
  .name { font-family: var(--serif); font-weight: 700; color: var(--green); font-size: 3.2cqw; line-height: 1.15; }
  .price { font-family: var(--serif); font-weight: 700; color: var(--green); font-size: 3.2cqw; font-variant-numeric: lining-nums tabular-nums; }
  .desc { grid-column: 1 / -1; font-size: 2.05cqw; line-height: 1.4; margin-top: .4cqw; }

  .feature, .soft { border: .2cqw solid #3b5a46; border-radius: 3cqw; padding: 2.2cqw 3cqw 1.6cqw; }
  .feature { background: var(--pink); }
  .feature h2 { border-bottom-color: #3b5a46; }
  .soft { background: var(--blush); }
  .soft h2 { border-bottom-color: #3b5a46; }
  .soft .item, .addons .item { padding: .7cqw 0; }
  .soft .name { font-size: 2.9cqw; } .soft .price { font-size: 2.9cqw; }

  .footer { position: relative; flex: none; margin: 0 7cqw 5.2cqw; padding-top: 2.4cqw; border-top: .2cqw solid var(--rule); text-align: center; }
  .key { font-family: var(--script); color: var(--green); font-size: 4.4cqw; }
  .key span { color: #d98a8e; }
  .handle { font-size: 2cqw; color: var(--green); margin-top: .8cqw; }
</style>
</head><body>
